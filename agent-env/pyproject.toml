[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-env"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "inquirer>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "click>=8.0",
]

[project.scripts]
agent-env = "agent_env.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
